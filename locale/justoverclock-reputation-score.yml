    firstLoginModalContent: "<p>\n    Этот форум использует динамическую систему репутации для поощрения позитивной активности в сообществе.\n    Как пользователь, вы можете зарабатывать очки репутации и вносить значимый вклад в обсуждения и взаимодействия, например:\n    <ul>\n      <li>\n        Создавать новые темы: делитесь своими мыслями и идеями с сообществом\n      </li>\n      <li>\n        Отвечать на сообщения: получайте очки в зависимости от качества ваших ответов\n      </li>\n      <li>\n        Отправлять жалобы на пользователей: помогайте поддерживать здоровую атмосферу, сообщая о неподобающем поведении\n      </li>\n      <li>\n        Получать лайки: выражайте признательность за чужие сообщения и получайте награду взамен\n      </li>\n      <li>\n        Оставлять лучшие ответы: зарабатывайте очки за ответы, которые решают проблему и выбраны лучшими\n      </li>\n    </ul>\n  </p>\n  <p>\n    Зарабатывайте очки репутации, помогая другим и внося вклад в жизнь сообщества. Ваши действия\n    говорят сами за себя, и с каждым очком вы получаете признание за свои усилия. Продолжайте быть активными и укрепляйте свою репутацию!\n  </p>\n"
