        export_description: 'Все файлы загружены пользователем.'
fof-upload:
  admin:
    help_texts:
      client_extension: "По умолчанию, при загрузке будет выбрано безопасное расширение файла на основе его типа MIME.\nДля некоторых файлов, основанных на ZIP или на бинарных данных, подобное поведение может привести к использованию общих расширений, вместо корректного.\nЗдесь Вы можете ввести список расширений (через \",\"), которые при загрузке файлов будут игнорироваться системой безопасности и сохранять своё исходное название.\n"
      composer_buttons: "По умолчанию отображаются кнопки менеджера файлов и загрузки. Вы можете выбрать отображение одной из кнопок.\n"
      custom_s3_url: "Публичный базовый URL, с которого раздаются ваши файлы, — CDN или собственный домен перед бакетом. Оставьте пустым, чтобы использовать URL провайдера по умолчанию. Должен включать <code>https://</code>.\n"
      disable-download-logging: "Отключить ведение журнала по каждому скачиванию файла. Если оставить включённым, Вы сможете видеть количество скачиваний и другие показатели статистики в ближайшем будущем.\n"
      disable-hotlink-protection: "hotlink-защита предотвращает скачивание файлов через другие сайты. Для этого требуется токен CSRF и ID сообщения.\n"
      download_templates: "Шаблоны скачивания это то, как загруженные файлы отображаются в сообщениях форума, например, как превью, кнопки, и т.п. Доступны следующие варианты:\n"
      local_cdn: "По желанию. Если вы раздаёте <code>assets/files</code> через CDN, укажите его базовый URL.\nСсылки на загруженные файлы будут использовать его. Оставьте пустым, чтобы отдавать файлы напрямую с форума.\n"
      mime_order: "Правила проверяются сверху вниз. Применяется первое совпадение, поэтому более специфичные правила следует размещать выше общих.\n"
      mime_types: "Определите, какие файлы участники могут загружать, где хранится каждый тип и как он отображается в сообщении.\n"
      resize: "Автоматическое изменение размеров изображений перед их загрузкой. Вы можете указать максимальную ширину и высоты в пикселях. При изменение размера сохраняются пропорции изображения.\n"
      s3_acl: "Применяется к каждому загружаемому объекту. Оставьте пустым, чтобы использовать значение провайдера по умолчанию — обычно private. Используйте <code>public-read</code>, если файлы должны быть доступны для чтения напрямую из бакета.\n"
      s3_acl_unsupported: "{provider} не поддерживает ACL. Управляйте публичным доступом через панель управления самого провайдера.\n"
      s3_compatible_storage: "Следующие настройки требуются только при использовании хранилища, совместимого с S3. Если Вы используете AWS, оставьте поля пустыми.\n"
      s3_endpoint: "URL API S3 провайдера — не публичный URL вашего бакета. Для Amazon S3 указывать его не нужно.\n"
      s3_instance_profile: "Оставьте оба поля пустыми, чтобы использовать роль IAM вместо ключей — работает только на EC2, ECS или EKS.\n"
      s3_path_style: "Помещает бакет в путь URL, а не в имя хоста. Требуется для MinIO и Cloudflare R2.\nУстанавливается автоматически при выборе провайдера.\n"
      s3_provider: "Выбор провайдера задаёт формат конечной точки, стиль адресации и поддержку ACL ниже.\nЕсли вашего провайдера нет в списке, выберите «Другой, совместимый с S3».\n"
      storage_configure_another: "Установлены и другие сервисы хранения, но они пока не настроены.\nНастройка сервиса не меняет хранилище файлов, пока вы не назначите его типу файлов.\n"
      storage_intro: "Здесь показаны сервисы, которые вы настроили или которые использует какой-либо тип файлов.\nСервис можно настроить до назначения типу файлов — сделайте это на вкладке «Файлы», когда будете готовы.\n"
      storage_not_installed: 'Ищете Amazon S3, Cloudflare R2 или Qiniu? Для них нужен дополнительный пакет — смотрите <a>установку адаптеров хранилища</a>.'
      thumbnail_quality: "Качество кодирования от 1 до 100, применяется к миниатюрам WebP и JPEG. Чем выше значение, тем чётче изображение,\nно тем больше размер файла. Миниатюры GIF и PNG сохраняются без потерь и не учитывают эту настройку.\nСуществующие миниатюры сохраняют текущее качество, пока не будут пересозданы командой backfill.\n"
      thumbnails: "Создаёт уменьшенную миниатюру изображения при загрузке. Миниатюра отображается прямо в сообщении.\nПри нажатии на неё открывается исходный файл в полном разрешении в новой вкладке.\nМиниатюры значительно уменьшают потребление трафика и общий вес страницы на форумах с большим количеством крупных изображений.\n"
      watermark: "Водяной знак будет добавляться к загружаемым изображениям (кроме GIF).\n"
    inspect-mime:
      description: "FoF Upload использует библиотеку <a>PHP Mime Detector</a> для распространенных типов MIME и PHP Fileinfo в качестве запасного варианта. \nЗначение MIME, возвращаемое Fileinfo, может отличаться от сервера к серверу!\n"
      guessed-extension: 'Расширение файла по умолчанию (если оригинал не занесен в белый список)'
